services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: polilink
      MYSQL_USER: polilink
      MYSQL_PASSWORD: polilink
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    working_dir: /var/www
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:7UdmB3sS0qcNClvdYFCm3cIL4leCe5AgdLwIL3SZFZQ=
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: polilink
      DB_USERNAME: polilink
      DB_PASSWORD: polilink
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "if [ ! -f vendor/autoload.php ]; then composer install --no-interaction; fi
      && php artisan migrate --force
      && php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started
    command: >
      sh -c "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi
      && npm run dev -- --host=0.0.0.0"

volumes:
  mysql_data:
  backend_vendor:
  frontend_node_modules:
